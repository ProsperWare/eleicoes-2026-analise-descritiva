name: Processar BUs localmente

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/process.yml'
      - 'requirements.txt'
  workflow_dispatch:

# Runner único: pushes seguidos no mesmo ref cancelam a run anterior
# e deixam só a mais recente seguir.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  process:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync repo to /home/alexa/eleicoes-2026-analise-descritiva
        run: |
          DEST="/home/alexa/eleicoes-2026-analise-descritiva"
          if [ ! -d "$DEST/.git" ]; then
            git clone https://github.com/ProsperWare/eleicoes-2026-analise-descritiva.git "$DEST"
          else
            cd "$DEST"
            git fetch origin
            git reset --hard origin/main
          fi

      - name: Dry-run cleanup top 5
        run: |
          SCRIPT="/home/alexa/eleicoes-2026-analise-descritiva/scripts/cleanup-top5.sh"
          if [ -f "$SCRIPT" ]; then
            chmod +x "$SCRIPT"
            "$SCRIPT"
          else
            echo "Script não encontrado"
            exit 1
          fi

      - name: Criar e ativar venv no workspace
        run: |
          if [ ! -d .venv ]; then
            python3 -m venv .venv
          fi
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "$(pwd)/.venv/bin" >> $GITHUB_PATH

      - name: Preparar base persistente de BUs
        run: |
          SHARED="/home/alexa/eleicoes-data/raw"
          mkdir -p "$SHARED"
          if [ ! -d data/raw ] || [ -z "$(ls -A data/raw 2>/dev/null)" ]; then
            mkdir -p data
            ln -sfn "$SHARED" data/raw
            echo "Usando base persistente: $SHARED"
          else
            echo "data/raw já tem conteúdo, mantendo"
          fi

      - name: Download BUs (só o que falta)
        run: |
          python scripts/download_bu.py --all
        continue-on-error: true

      - name: Pré-processar BUs (agrega e salva Parquet — só reprocessa se necessário)
        run: python scripts/preprocess_bu.py

      - name: Processar e gerar resultados (lê Parquet)
        run: python scripts/process_and_summarize.py

      - name: Commit resultados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resultados/
          if git diff --staged --quiet; then
            echo "Nada para commitar em resultados/"
          else
            git commit -m "Atualiza resultados [skip ci]"
            # actions/checkout deixa HEAD detached no SHA do disparo.
            # Integra origin/main e envia HEAD:main, com retentativas se o remoto avançar.
            attempts=3
            for attempt in 1 2 3; do
              if ! git fetch origin main; then
                echo "git fetch origin main falhou (tentativa ${attempt}/${attempts})"
              elif ! git pull --rebase origin main; then
                if [ -d "$(git rev-parse --git-path rebase-merge)" ] || [ -d "$(git rev-parse --git-path rebase-apply)" ]; then
                  git rebase --abort
                  echo "Conflito ao integrar origin/main; rebase abortado"
                  exit 1
                fi
                echo "git pull --rebase origin main falhou (tentativa ${attempt}/${attempts})"
              elif git push origin HEAD:main; then
                echo "Resultados enviados para main"
                exit 0
              else
                echo "Push rejeitado (tentativa ${attempt}/${attempts}): o remoto contém commits que não estão no checkout"
              fi
              if [ "$attempt" -lt "$attempts" ]; then
                sleep_for=$((attempt * 2))
                echo "Nova tentativa em ${sleep_for}s"
                sleep "$sleep_for"
              fi
            done
            echo "Falha ao enviar resultados para main após ${attempts} tentativas"
            exit 1
          fi
