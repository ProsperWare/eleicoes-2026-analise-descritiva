name: Processar BUs localmente

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/process.yml'
      - 'requirements.txt'
  workflow_dispatch:  # permite disparo manual

jobs:
  process:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Criar e ativar venv no workspace
        run: |
          if [ ! -d .venv ]; then
            python3 -m venv .venv
          fi
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "$(pwd)/.venv/bin" >> $GITHUB_PATH

      - name: Download BUs (GO e MG)
        run: |
          python scripts/download_bu.py --ufs GO MG
        continue-on-error: true  # não falha o job se já tiver baixado ou houver problema de rede

      - name: Processar e gerar resultados
        run: |
          python scripts/process_and_summarize.py

      - name: Listar resultados
        run: |
          echo "Conteúdo de resultados/:"
          ls -la resultados/ || true

      - name: Imprimir cobertura baseline
        run: |
          echo "========== cobertura_baseline.txt =========="
          cat resultados/cobertura_baseline.txt || true
          echo ""

      - name: Imprimir regras árvore GO
        run: |
          echo "========== regras_arvore_GO.txt =========="
          cat resultados/regras_arvore_GO.txt || true
          echo ""

      - name: Imprimir regras árvore MG
        run: |
          echo "========== regras_arvore_MG.txt =========="
          cat resultados/regras_arvore_MG.txt || true
          echo ""

      - name: Imprimir importância features GO
        run: |
          echo "========== importancia_features_GO.txt =========="
          cat resultados/importancia_features_GO.txt || true
          echo ""

      - name: Imprimir importância features MG
        run: |
          echo "========== importancia_features_MG.txt =========="
          cat resultados/importancia_features_MG.txt || true
          echo ""

      - name: Imprimir Logit binário GO
        run: |
          echo "========== logit_binario_GO.txt =========="
          cat resultados/logit_binario_GO.txt || true
          echo ""

      - name: Imprimir Logit binário MG
        run: |
          echo "========== logit_binario_MG.txt =========="
          cat resultados/logit_binario_MG.txt || true
          echo ""

      - name: Imprimir Linear GO
        run: |
          echo "========== linear_fractional_GO.txt =========="
          cat resultados/linear_fractional_GO.txt || true
          echo ""

      - name: Imprimir Linear MG
        run: |
          echo "========== linear_fractional_MG.txt =========="
          cat resultados/linear_fractional_MG.txt || true
          echo ""
