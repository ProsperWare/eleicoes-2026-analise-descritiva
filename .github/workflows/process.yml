name: Processar BUs localmente

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/process.yml'
      - 'requirements.txt'
  workflow_dispatch:  # permite disparo manual

jobs:
  process:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync repo to /home/alexa/eleicoes-2026-analise-descritiva
        run: |
          DEST="/home/alexa/eleicoes-2026-analise-descritiva"
          if [ ! -d "$DEST/.git" ]; then
            echo "Clonando repositório em $DEST ..."
            git clone https://github.com/ProsperWare/eleicoes-2026-analise-descritiva.git "$DEST"
          else
            echo "Atualizando repositório em $DEST ..."
            cd "$DEST"
            git fetch origin
            git reset --hard origin/main
          fi
          echo "Repo sincronizado. Conteúdo de scripts/:"
          ls -la "$DEST/scripts/" || true

      - name: Dry-run cleanup top 5
        run: |
          SCRIPT="/home/alexa/eleicoes-2026-analise-descritiva/scripts/cleanup-top5.sh"
          if [ -f "$SCRIPT" ]; then
            chmod +x "$SCRIPT"
            "$SCRIPT"
          else
            echo "Script não encontrado em $SCRIPT"
            exit 1
          fi

      - name: Auditar espaço em disco e pasta home
        run: |
          echo "===== DISCO ====="
          df -h
          echo ""
          echo "===== TOP PASTAS NO HOME ====="
          du -sh ~/* 2>/dev/null | sort -hr | head -40
          echo ""
          echo "===== ARQUIVOS GRANDES NO HOME (>100MB) ====="
          find ~ -type f -size +100M -exec ls -lh {} \; 2>/dev/null | sort -k5 -hr | head -30
          echo ""
          echo "===== CACHE E TEMPORARIOS ====="
          du -sh ~/.cache ~/.local/share ~/.npm ~/.cargo 2>/dev/null || true
          echo ""

      - name: Criar e ativar venv no workspace
        run: |
          if [ ! -d .venv ]; then
            python3 -m venv .venv
          fi
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "$(pwd)/.venv/bin" >> $GITHUB_PATH

      - name: Download BUs (todas as UFs)
        run: |
          python scripts/download_bu.py --all
        continue-on-error: true  # não falha o job se já tiver baixado ou houver problema de rede

      - name: Processar e gerar resultados
        run: |
          python scripts/process_and_summarize.py

      - name: Listar resultados
        run: |
          echo "Conteúdo de resultados/:"
          ls -la resultados/ || true

      - name: Imprimir cobertura baseline
        run: |
          echo "========== cobertura_baseline.txt =========="
          cat resultados/cobertura_baseline.txt || true
          echo ""

      - name: Imprimir resumo consolidado
        run: |
          echo "========== resumo_modelos.txt =========="
          cat resultados/resumo_modelos.txt || true
          echo ""

      - name: Imprimir efeito comparecimento GO
        run: |
          echo "========== efeito_comparecimento_GO.txt =========="
          cat resultados/efeito_comparecimento_GO.txt || true
          echo ""

      - name: Imprimir efeito comparecimento MG
        run: |
          echo "========== efeito_comparecimento_MG.txt =========="
          cat resultados/efeito_comparecimento_MG.txt || true
          echo ""

      - name: Imprimir resíduos árvore GO
        run: |
          echo "========== residuos_arvore_GO.txt =========="
          cat resultados/residuos_arvore_GO.txt || true
          echo ""
