name: Processar BUs localmente

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/process.yml'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  process:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync repo to /home/alexa/eleicoes-2026-analise-descritiva
        run: |
          DEST="/home/alexa/eleicoes-2026-analise-descritiva"
          if [ ! -d "$DEST/.git" ]; then
            git clone https://github.com/ProsperWare/eleicoes-2026-analise-descritiva.git "$DEST"
          else
            cd "$DEST"
            git fetch origin
            git reset --hard origin/main
          fi

      - name: Dry-run cleanup top 5
        run: |
          SCRIPT="/home/alexa/eleicoes-2026-analise-descritiva/scripts/cleanup-top5.sh"
          if [ -f "$SCRIPT" ]; then
            chmod +x "$SCRIPT"
            "$SCRIPT"
          else
            echo "Script não encontrado"
            exit 1
          fi

      - name: Criar e ativar venv no workspace
        run: |
          if [ ! -d .venv ]; then
            python3 -m venv .venv
          fi
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "$(pwd)/.venv/bin" >> $GITHUB_PATH

      - name: Preparar base persistente de BUs
        run: |
          SHARED="/home/alexa/eleicoes-data/raw"
          mkdir -p "$SHARED"
          if [ ! -d data/raw ] || [ -z "$(ls -A data/raw 2>/dev/null)" ]; then
            mkdir -p data
            ln -sfn "$SHARED" data/raw
            echo "Usando base persistente: $SHARED"
          else
            echo "data/raw já tem conteúdo, mantendo"
          fi

      - name: Download BUs (só o que falta)
        run: |
          python scripts/download_bu.py --all
        continue-on-error: true

      - name: Processar e gerar resultados
        run: python scripts/process_and_summarize.py

      - name: Diagnóstico resultados
        run: |
          echo "PWD: $(pwd)"
          echo "--- ls resultados/ ---"
          ls -la resultados/ || echo "pasta resultados não existe"
          echo "--- ls /home/alexa/eleicoes-2026-analise-descritiva/resultados/ ---"
          ls -la /home/alexa/eleicoes-2026-analise-descritiva/resultados/ || echo "não existe no DEST"

      - name: Imprimir resumo mult3
        run: |
          echo "========== resumo_mult3.txt =========="
          cat resultados/resumo_mult3.txt || true
          echo ""

      - name: Imprimir regras mult3 GO
        run: |
          echo "========== regras_mult3_GO.txt =========="
          cat resultados/regras_mult3_GO.txt || true
          echo ""

      - name: Imprimir regras mult3 MG
        run: |
          echo "========== regras_mult3_MG.txt =========="
          cat resultados/regras_mult3_MG.txt || true
          echo ""
