name: Processar BUs localmente

on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/process.yml'
      - 'requirements.txt'
  workflow_dispatch:

jobs:
  process:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync repo to /home/alexa/eleicoes-2026-analise-descritiva
        run: |
          DEST="/home/alexa/eleicoes-2026-analise-descritiva"
          if [ ! -d "$DEST/.git" ]; then
            git clone https://github.com/ProsperWare/eleicoes-2026-analise-descritiva.git "$DEST"
          else
            cd "$DEST"
            git fetch origin
            git reset --hard origin/main
          fi

      - name: Dry-run cleanup top 5
        run: |
          SCRIPT="/home/alexa/eleicoes-2026-analise-descritiva/scripts/cleanup-top5.sh"
          if [ -f "$SCRIPT" ]; then
            chmod +x "$SCRIPT"
            "$SCRIPT"
          else
            echo "Script não encontrado"
            exit 1
          fi

      - name: Criar e ativar venv no workspace
        run: |
          if [ ! -d .venv ]; then
            python3 -m venv .venv
          fi
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          echo "$(pwd)/.venv/bin" >> $GITHUB_PATH

      - name: Download BUs (todas as UFs)
        run: python scripts/download_bu.py --all
        continue-on-error: true

      - name: Processar e gerar resultados
        run: python scripts/process_and_summarize.py

      - name: Imprimir resumo preditivo sequencial
        run: |
          echo "========== resumo_preditivo_sequencial.txt =========="
          cat resultados/resumo_preditivo_sequencial.txt || true
          echo ""

      - name: Imprimir preditivo sequencial GO
        run: |
          echo "========== preditivo_sequencial_GO.txt =========="
          cat resultados/preditivo_sequencial_GO.txt || true
          echo ""

      - name: Imprimir preditivo sequencial MG
        run: |
          echo "========== preditivo_sequencial_MG.txt =========="
          cat resultados/preditivo_sequencial_MG.txt || true
          echo ""
